services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pygmalion
      POSTGRES_PASSWORD: pygmalion
      POSTGRES_DB: pygmalion
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pygmalion -d pygmalion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
